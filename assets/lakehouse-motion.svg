<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Live motion lakehouse with data particles</title>
  <desc id="desc">Glowing data particles travel continuously from Bronze through Silver to Gold beneath pulsing radar beams.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/><stop offset="0.55" stop-color="#111827"/><stop offset="1" stop-color="#24164d"/>
    </linearGradient>
    <linearGradient id="track" x1="0" x2="1">
      <stop stop-color="#ff3621"/><stop offset="0.5" stop-color="#fbbf24"/><stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
    <radialGradient id="beam">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.9"/><stop offset="0.25" stop-color="#60a5fa" stop-opacity="0.38"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .route{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:5 9;opacity:.65}
      .flow{fill:none;stroke:url(#track);stroke-width:4;stroke-linecap:round;stroke-dasharray:4 18;animation:travel 1.8s linear infinite}
      .node{animation:breathe 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .n2{animation-delay:.5s}.n3{animation-delay:1s}
      .sweep{transform-box:fill-box;transform-origin:center;animation:sweep 3.8s linear infinite}
      .s2{animation-duration:5s;animation-direction:reverse}.s3{animation-duration:4.4s}
      .packet{filter:url(#glow);animation:packet 4.8s cubic-bezier(.42,0,.58,1) infinite}
      .p2{animation-delay:.8s}.p3{animation-delay:1.6s}.p4{animation-delay:2.4s}.p5{animation-delay:3.2s}.p6{animation-delay:4s}
      .particle{filter:url(#softGlow);animation:twinkle 2.2s ease-in-out infinite alternate}
      .q2{animation-delay:.4s}.q3{animation-delay:.8s}.q4{animation-delay:1.2s}.q5{animation-delay:1.6s}.q6{animation-delay:2s}
      .ring{fill:none;stroke:#60a5fa;stroke-opacity:.5;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ripple 3s ease-out infinite}
      .r2{animation-delay:1s}.r3{animation-delay:2s}
      @keyframes travel{to{stroke-dashoffset:-88}}
      @keyframes breathe{0%,100%{transform:scale(1);opacity:.86}50%{transform:scale(1.12);opacity:1}}
      @keyframes sweep{to{transform:rotate(360deg)}}
      @keyframes packet{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(650px);opacity:0}}
      @keyframes twinkle{from{opacity:.25;transform:scale(.65)}to{opacity:1;transform:scale(1.5)}}
      @keyframes ripple{0%{transform:scale(.6);opacity:.75}100%{transform:scale(2.2);opacity:0}}
      @media(prefers-reduced-motion:reduce){.flow,.node,.sweep,.packet,.particle,.ring{animation:none}.packet,.ring{display:none}}
    </style>
  </defs>

  <rect width="960" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="110" cy="20" r="130" fill="#ff3621" opacity=".08"/><circle cx="850" cy="270" r="150" fill="#60a5fa" opacity=".1"/>
  <text x="44" y="52" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="1">LIVE LAKEHOUSE MOTION</text>
  <text x="44" y="76" fill="#94a3b8" font-size="12">Streaming particles · pulsing stages · Bronze → Silver → Gold</text>

  <path class="route" d="M155 175H805"/><path class="flow" d="M155 175H805"/>
  <circle class="ring" cx="155" cy="175" r="31"/><circle class="ring r2" cx="480" cy="175" r="31"/><circle class="ring r3" cx="805" cy="175" r="31"/>

  <g class="node n1" transform="translate(155 175)">
    <circle r="70" fill="url(#beam)"/><g class="sweep"><rect x="-3" y="-68" width="6" height="68" rx="3" fill="#60a5fa" opacity=".72"/></g>
    <circle r="36" fill="#ff3621" opacity=".16"/><circle r="25" fill="#111827" stroke="#ff3621" stroke-width="2"/>
    <text y="5" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">BRONZE</text>
  </g>
  <g class="node n2" transform="translate(480 175)">
    <circle r="70" fill="url(#beam)"/><g class="sweep s2"><rect x="-3" y="-68" width="6" height="68" rx="3" fill="#60a5fa" opacity=".72"/></g>
    <circle r="36" fill="#fbbf24" opacity=".16"/><circle r="25" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
    <text y="5" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">SILVER</text>
  </g>
  <g class="node n3" transform="translate(805 175)">
    <circle r="70" fill="url(#beam)"/><g class="sweep s3"><rect x="-3" y="-68" width="6" height="68" rx="3" fill="#60a5fa" opacity=".72"/></g>
    <circle r="36" fill="#84cc16" opacity=".16"/><circle r="25" fill="#111827" stroke="#84cc16" stroke-width="2"/>
    <text y="5" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">GOLD</text>
  </g>

  <circle class="packet" cx="155" cy="175" r="5" fill="#fff"/><circle class="packet p2" cx="155" cy="175" r="4" fill="#fbbf24"/><circle class="packet p3" cx="155" cy="175" r="4" fill="#fb7185"/><circle class="packet p4" cx="155" cy="175" r="5" fill="#60a5fa"/><circle class="packet p5" cx="155" cy="175" r="3" fill="#a3e635"/><circle class="packet p6" cx="155" cy="175" r="4" fill="#fff"/>

  <circle class="particle" cx="88" cy="127" r="2.5" fill="#60a5fa"/><circle class="particle q2" cx="260" cy="225" r="2" fill="#fbbf24"/><circle class="particle q3" cx="355" cy="119" r="3" fill="#fb7185"/><circle class="particle q4" cx="450" cy="245" r="2.5" fill="#60a5fa"/><circle class="particle q5" cx="620" cy="112" r="2" fill="#a3e635"/><circle class="particle q6" cx="738" cy="236" r="3" fill="#60a5fa"/><circle class="particle q3" cx="900" cy="130" r="2.5" fill="#fbbf24"/><circle class="particle q2" cx="90" cy="236" r="2" fill="#fb7185"/><circle class="particle q4" cx="560" cy="112" r="2" fill="#fff"/><circle class="particle q5" cx="218" cy="105" r="2" fill="#84cc16"/><circle class="particle q6" cx="680" cy="252" r="2.5" fill="#fb7185"/><circle class="particle q2" cx="840" cy="235" r="2" fill="#fff"/>

  <text x="480" y="278" text-anchor="middle" fill="#94a3b8" font-size="12">Animated visualization · enhances the README experience</text>
</svg>
